[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "threads-outreach"
version = "0.1.0"
description = "Finds postpartum conversations on Threads, drafts caring replies with Claude, and posts the ones a human approves."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10,<3",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
outreach = "outreach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["outreach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
